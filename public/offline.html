<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>You're offline — SRD Learn</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fafafa;
        color: #18181b;
        text-align: center;
      }
      .card { max-width: 420px; }
      .icon {
        width: 72px; height: 72px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 20px; background: #eef2ff; color: #4f46e5; font-size: 34px;
      }
      h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
      p { margin-top: 10px; font-size: 14px; color: #71717a; line-height: 1.5; }
      button {
        margin-top: 22px; border: 0; cursor: pointer;
        background: #4f46e5; color: #fff; font-weight: 600; font-size: 14px;
        padding: 12px 22px; border-radius: 12px;
      }
      button:hover { background: #4338ca; }
      @media (prefers-color-scheme: dark) {
        body { background: #09090b; color: #fafafa; }
        .icon { background: #1e1b4b; color: #a5b4fc; }
        p { color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📶</div>
      <h1>You're offline</h1>
      <p>SRD Learn needs a connection to load courses. Check your internet and try again — your progress and bookmarks are safe.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
